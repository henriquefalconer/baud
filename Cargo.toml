[workspace]
resolver = "2"
members = [
    "crates/baud-multiverse",
    "crates/baud-host",
    "crates/baud-vcpu",
    "crates/baud-snapshot",
    "crates/baud-proto",
    "crates/baud-tape-device",
    "crates/baud-secret",
    "crates/baud-keys",
    "crates/baud-server",
    "crates/baud-cli",
    "crates/baud-identity",
    "crates/baud-tape",
    "crates/baud-tape-local",
    "crates/baud-init",
    "crates/baud-packages",
    "crates/baud-driver",
    "crates/baud-journal",
    "crates/baud-stream",
    "crates/baud-raftlet",
    "crates/baud-tracing",
    "crates/baud-tape-agent",
    "crates/baud-snapshot-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Henrique Falconer"]
license = "Proprietary"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"

# Crypto / JWT
ed25519-dalek = { version = "2", features = ["rand_core"] }
jsonwebtoken = "9"
zeroize = { version = "1", features = ["derive"] }

# Server
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
hyper = "1"
futures-util = "0.3"
tokio-tungstenite = "0.29"

# CLI
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json"] }

# Config / spec parsing
serde_yaml = "0.9"
toml = "0.8"

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
sha2 = "0.10"
age = "0.12"
rand = "0.8"
rand_chacha = "0.3"
async-trait = "0.1"
tempfile = "3"
