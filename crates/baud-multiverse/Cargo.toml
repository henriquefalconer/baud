[package]
name = "baud-multiverse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic supervisor for baud guest processes"

[dependencies]
baud-proto = { path = "../baud-proto" }
baud-vcpu = { path = "../baud-vcpu" }
baud-host = { path = "../baud-host" }
baud-tape-device = { path = "../baud-tape-device" }
baud-snapshot = { path = "../baud-snapshot" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
libc = "0.2"
# The console device (`console.rs`, specs/baud-multiverse.md §2's pinned skeleton dep) is pure
# Rust with no non-dev dependencies of its own (checked against vm-superio's own Cargo.toml), so
# unlike the other KVM-boot skeleton deps below it is a plain (non-linux-gated) dependency —
# `console.rs` and its tests run on this Windows dev machine with no KVM at all.
vm-superio = "0.8"

# specs/baud-multiverse.md §2's remaining pinned skeleton deps. Real KVM/guest-boot code (Kvm::new →
# create_vm → register RAM → create_vcpu → CPUID/TSC/MSR → linux-loader boot, crates/
# baud-multiverse/src/linux/) is cfg(target_os = "linux")-gated, same pattern as baud-host and
# baud-vcpu: type-checked via `cargo check --target x86_64-unknown-linux-gnu -p baud-multiverse`
# on this Windows dev machine, not yet exercised against real /dev/kvm (todo.md §14).
[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.25"
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
vm-memory = { version = "0.18", features = ["backend-mmap", "rawfd"] }
linux-loader = { version = "0.14", features = ["bzimage", "elf"] }
vmm-sys-util = "0.15"
# The work-clock's real branch-counter source (`linux::LinuxBranchCounter`, specs/baud-multiverse.md
# §4's "Work-clock" row) — same crate/version baud-vcpu's `LinuxPmuStepper` already pins.
perf-event = "0.4"
# The virtio-blk base image's read-only memory map (`virtio_blk::BlockBase::Mapped`) — gated
# alongside `vm-memory` because the only module that names it (`virtio_blk.rs`) is itself
# `cfg(target_os = "linux")`-gated in lib.rs for exactly that reason.
memmap2 = "0.9"

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1"
# Only for periodic_tick_watchdog_kills_a_stuck_tick_via_spawn_blocking, which reproduces the
# exact thread the real baud-server run loop executes on (todo.md §14 item 16/17) — every real
# boot runs inside tokio::task::spawn_blocking, not a plain #[test]'s own OS thread.
tokio = { workspace = true }
# Only for framebuffer_guest_frame_is_reproducible_across_boots' cross-check that
# baud-tape-device's Frame-record hash agrees with baud-stream's own fingerprint function — no
# non-test code in this crate depends on baud-stream.
baud-stream = { path = "../baud-stream" }
# Only for guest_boots_a_pipeline_built_multi_file_initramfs, which builds its initramfs via the
# real reproducible-cpio pipeline (baud_packages::initramfs) instead of a hand-cpio'd fixture, to
# prove the pipeline's multi-file capacity against a real KVM boot — no non-test code in this
# crate depends on baud-packages.
baud-packages = { path = "../baud-packages" }
