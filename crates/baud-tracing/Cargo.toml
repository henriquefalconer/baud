[package]
name = "baud-tracing"
description = "baud observation plane 2: kernel-side ground truth (eBPF/fallback)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
baud-proto = { path = "../baud-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
uuid = { workspace = true }
libc = "0.2"

# aya: Linux-only eBPF library for loading prebuilt CO-RE probes.
# On Linux, the Native path uses aya to load .bpf.o objects from the probe set
# and drain the ringbuf into EbpfRecord events.
# On macOS and other platforms, this dependency is not available; the Fallback
# shim path handles all event collection.
[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", default-features = false }

[dev-dependencies]
# none needed
