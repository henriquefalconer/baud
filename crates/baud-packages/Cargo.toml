[package]
name = "baud-packages"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Workload specs as Nix building blocks: spec.toml → pinned flake → static guests + closure hash"

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
# rdseed build-time rewrite pass (todo.md §3.8/§4): real ELF section parsing + a real x86
# decoder -- never a byte-grep over `SHF_EXECINSTR` sections.
object = "0.36"
capstone = "0.14"
# reproducible initramfs builder (todo.md §4.3): pure-Rust gzip so the archive's compressed bytes
# are a deterministic function of this crate's pinned dependency, never the host's `gzip` binary.
flate2 = "1"

[dev-dependencies]
proptest = "1"
